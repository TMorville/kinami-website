<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Drone Reporter</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

        <!-- GoatCounter (cookieless): auto pageview = gate shown (path keeps ?ref); a 'deck-open-<ref>' event fires on decrypt -->
        <script>window.goatcounter = { path: function () { return location.pathname + location.search; } };</script>
        <script data-goatcounter="https://dronetracker.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

        <style>
            /* Live Sky, blue hour (the brand state), from the locked kit
               history/design/2026-09-24-live-sky/livesky.css. The deck's cover
               is the same state, so the gate opens onto a matching sky. */
            :root {
                --sky: linear-gradient(180deg, #152342 0%, #34466C 42%, #7A7C92 72%, #C98A68 100%);
                --fg: #EEF1F7;
                --fg2: rgba(238, 241, 247, 0.72);
                --rep: #FFFFFF;
                --repglow: 0 0 0 5px rgba(255, 255, 255, 0.14), 0 0 14px 4px rgba(255, 255, 255, 0.5);
                --beacon: #FF3B30;
                --panel: rgba(20, 28, 46, 0.72);
                --panelline: rgba(255, 255, 255, 0.08);
                --btnbg: #EEF1F7;
                --btnfg: #152342;
                --field: rgba(255, 255, 255, 0.08);
                --halo: 0 0 3px rgba(6, 10, 20, 0.6), 0 0 10px rgba(6, 10, 20, 0.5);
                --font: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
                --gx: clamp(16px, 6.6vw, 128px);
            }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: #152342;
            }

            .staticrypt-content {
                min-height: 100%;
                margin: 0;
                color: var(--fg);
                font-family: var(--font);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                background: linear-gradient(90deg, rgba(10, 16, 32, 0.6) 0%, rgba(10, 16, 32, 0.2) 55%, rgba(10, 16, 32, 0) 80%),
                    url("assets/sky-road.jpg") 50% 60% / cover no-repeat, var(--sky);
            }

            .staticrypt-page {
                min-height: 100vh;
                min-height: 100svh;
                box-sizing: border-box;
                padding: clamp(96px, 26vh, 280px) var(--gx) 48px;
            }

            /* The deck title renders as the wordmark, top left, with the
               strobe and beacon pair drawn before it (the .wm rules in index.html). */
            .staticrypt-title {
                position: absolute;
                top: clamp(16px, 4.6vh, 48px);
                left: var(--gx);
                margin: 0;
                display: inline-flex;
                align-items: center;
                font-size: clamp(20px, 1.75vw, 34px);
                font-weight: 600;
                letter-spacing: -0.02em;
                line-height: 1;
                text-transform: lowercase;
                color: var(--fg);
                text-shadow: var(--halo);
            }

            .staticrypt-title::before {
                content: "";
                flex: none;
                width: 0.4em;
                height: 0.4em;
                border-radius: 50%;
                background: var(--rep);
                box-shadow: var(--repglow);
                margin-right: 0.93em;
            }

            .staticrypt-title::after {
                content: "";
                position: absolute;
                left: 0.61em;
                top: calc(50% - 0.24em);
                width: 0.25em;
                height: 0.25em;
                border-radius: 50%;
                background: var(--beacon);
            }

            .staticrypt-form {
                width: 100%;
                max-width: 440px;
                box-sizing: border-box;
                background: var(--panel);
                -webkit-backdrop-filter: blur(20px);
                backdrop-filter: blur(20px);
                border: 1px solid var(--panelline);
                border-radius: 30px;
                padding: 32px 28px 28px;
                text-align: left;
            }

            .staticrypt-instructions {
                margin: 0 0 24px;
            }

            .staticrypt-heading {
                font-size: 28px;
                font-weight: 600;
                letter-spacing: -0.02em;
                line-height: 1.12;
                color: var(--fg);
                margin: 0;
            }

            .staticrypt-instructions p:not(.staticrypt-heading) {
                font-size: 17px;
                line-height: 1.4;
                color: var(--fg2);
                margin: 10px 0 0;
            }

            .staticrypt-hr {
                display: none;
            }

            .staticrypt-password-container {
                position: relative;
                background: var(--field);
                border: 1px solid var(--panelline);
                border-radius: 14px;
                width: 100%;
                margin: 0 0 14px;
                box-sizing: border-box;
            }

            .staticrypt-password-container:focus-within {
                border-color: rgba(255, 255, 255, 0.5);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-family: var(--font);
                font-size: 17px;
                color: var(--fg);
                outline: 0;
                height: 52px;
                padding: 0 48px 0 16px;
                width: 100%;
            }

            .staticrypt-form input::placeholder {
                color: var(--fg2);
                opacity: 1;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.7;
                filter: invert(1);
                padding: 15px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                font-family: var(--font);
                font-size: 17px;
                font-weight: 600;
                height: 56px;
                border-radius: 18px;
                background: var(--btnbg);
                color: var(--btnfg);
                border: 1.5px solid var(--btnbg);
                width: 100%;
                cursor: pointer;
                -webkit-appearance: none;
                appearance: none;
                transition: filter 0.15s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover {
                filter: brightness(96%);
            }

            .staticrypt-form .staticrypt-decrypt-button:focus-visible {
                outline: 2px solid #FFFFFF;
                outline-offset: 3px;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                font-size: 15px;
                color: var(--fg2);
                margin-bottom: 14px;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3);
                margin-right: 1em;
                accent-color: var(--fg);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--sky);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.2em solid rgba(238, 241, 247, 0.25);
                border-right-color: var(--fg);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media (max-width: 520px) {
                .staticrypt-page {
                    padding-top: 112px;
                }

                .staticrypt-form {
                    padding: 24px 20px 20px;
                }
            }
        </style>
    </head>
