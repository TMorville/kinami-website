<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>omfavn</title>
  <meta name="description" content="An AI parenting coach grounded in your family's everyday moments. An iPhone app in Danish, in closed beta.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="canonical" href="https://omfavn.app/">
  <meta property="og:title" content="omfavn">
  <meta property="og:description" content="An AI parenting coach grounded in your family's everyday moments.">
  <meta property="og:image" content="https://omfavn.app/assets/og.png">
  <meta property="og:url" content="https://omfavn.app/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://omfavn.app/assets/og.png">
  <meta name="theme-color" content="#F5F0E8">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --paper:#F5F0E8; --ink:#2A2520;
      --ink-dim:rgba(42,37,32,0.66);
      --sienna:#A0522D; --ochre:#C4A265;
      --ember:#E8A574;                      /* the deck's accent on ink */
      --on-ink:#F5F0E8; --on-ink-dim:rgba(245,240,232,0.66);
      --serif:'Cormorant Infant', Georgia, serif;
      --mono:'DM Mono', ui-monospace, monospace;
      /* one size drives the mark and the word under it */
      --d: min(84vw, 54svh, 600px);
    }
    /* scroll moves a whole page at a time. WebKit stops only at snap points, so the footer
       gets one too: on a short screen the second page is taller than the viewport */
    html { -webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-snap-type:y mandatory; }
    .hero, .about { scroll-snap-align:start; }
    footer { scroll-snap-align:end; }
    body { background:var(--paper); color:var(--ink); font-family:var(--serif); -webkit-font-smoothing:antialiased; }

    /* ---------- hero ---------- */
    .hero {
      position:relative; min-height:100svh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:40px 16px 88px;
      background:
        radial-gradient(circle at 100% 0%, rgba(196,162,101,0.26), transparent 52%),
        var(--paper);
      overflow:clip;
    }
    .mark { width:var(--d); aspect-ratio:1; }
    .mark img { display:block; width:100%; height:100%; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; }
    .mark img:not([src]) { display:none; }   /* the painting until the script gives it a source */
    .word {
      /* the painted ring fills ~84% of its image box, so pull the word up into that margin */
      margin-top:calc(var(--d) * -0.05);
      font-weight:300; letter-spacing:-0.015em; line-height:1;
      font-size:calc(var(--d) * 0.19);
      color:var(--sienna);                  /* the app's onboarding wordmark */
      opacity:0; animation:rise 1.8s cubic-bezier(.2,.7,.2,1) 1.7s forwards;
    }
    .tag {
      display:flex; align-items:center; gap:12px; margin-top:clamp(14px,2.4svh,22px);
      font-family:var(--mono); font-weight:300; font-size:13px; letter-spacing:.06em; color:var(--ink-dim);
      opacity:0; animation:rise .9s ease 2.6s forwards;
    }
    .tag::before, .tag::after { content:""; width:20px; height:1px; background:rgba(196,162,101,0.6); }
    .tag i { font-family:var(--serif); font-style:italic; font-size:17px; letter-spacing:.01em; color:var(--sienna); }
    .cue {
      position:absolute; left:50%; bottom:24px; transform:translateX(-50%);
      width:24px; height:44px; display:block; opacity:0; animation:fade .9s ease 3s forwards;
    }
    .cue::after {
      content:""; position:absolute; left:50%; top:0; width:1px; height:100%;
      background:var(--sienna); transform-origin:top; animation:drip 2.4s cubic-bezier(.5,0,.3,1) 3s infinite;
    }
    .cue:focus-visible { outline:2px solid var(--sienna); outline-offset:4px; border-radius:2px; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @keyframes fade { to { opacity:1; } }
    @keyframes drip { 0%{ transform:scaleY(0); opacity:1; } 60%{ transform:scaleY(1); opacity:1; } 100%{ transform:scaleY(1); opacity:0; } }

    /* ---------- the ink page ---------- */
    .about {
      /* lvh, not svh: on a phone the toolbar is collapsed by the time this page is on screen */
      min-height:100lvh; background:var(--ink); color:var(--on-ink);
      display:grid; grid-template-rows:1fr auto; padding:clamp(64px,12svh,120px) 16px 0;
    }
    .about:focus { outline:none; }   /* focused by the scroll cue, as a target, not a control */
    .about .inner { width:100%; max-width:880px; margin:0 auto; align-self:center; display:grid; gap:clamp(40px,7svh,72px); }
    .block h2 {
      display:flex; align-items:center; gap:12px;
      font-family:var(--mono); font-weight:400; font-size:12px; text-transform:uppercase; letter-spacing:.16em; color:var(--ember);
    }
    .block h2::before { content:""; width:26px; height:1px; background:var(--ember); opacity:.7; }
    .block p {
      margin-top:20px; font-weight:300;
      font-size:clamp(26px, 1.6vw + 14px, 36px); line-height:1.28; letter-spacing:-0.005em;
      color:var(--on-ink); max-width:26em;
    }
    .block p a {
      color:var(--ember); text-decoration:underline; text-decoration-thickness:1px;
      text-underline-offset:.18em; text-decoration-color:rgba(232,165,116,0.5);
      transition:color .2s ease, text-decoration-color .2s ease;
    }
    .block p a:hover { color:var(--on-ink); text-decoration-color:var(--on-ink); }
    .block p a:focus-visible, footer a:focus-visible { outline:2px solid var(--ember); outline-offset:4px; border-radius:2px; }

    footer {
      width:100%; max-width:880px; margin:clamp(48px,8svh,80px) auto 0; padding:22px 0 36px;
      border-top:1px solid rgba(245,240,232,0.12);
      display:flex; flex-wrap:wrap; gap:10px 28px; align-items:baseline;
      font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--on-ink-dim);
    }
    footer a { color:var(--on-ink-dim); text-decoration:none; transition:color .2s ease; }
    footer a:hover { color:var(--ember); }
    footer .sp { margin-left:auto; }
    @media (max-width:560px) { footer .sp { margin-left:0; } }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior:auto; }
      .cue::after { animation:none; }
      .word, .tag, .cue { animation:none; opacity:1; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-label="omfavn">
      <div class="mark">
        <img class="ink-paint" alt="" aria-hidden="true" draggable="false">
        <noscript><img src="assets/ink.webp" alt="" aria-hidden="true" draggable="false"></noscript>
      </div>
      <h1 class="word">omfavn</h1>
      <p class="tag"><i>om&middot;fawn</i>to embrace</p>
      <a class="cue" href="#about" aria-label="Scroll to what omfavn is"></a>
    </section>

    <section class="about" id="about" aria-label="About omfavn" tabindex="-1">
      <div class="inner">
        <div class="block">
          <h2>What it is</h2>
          <p>Omfavn helps parents reflect on everyday moments. Record dinner or bedtime and get a fresh perspective from Oline, your AI parenting coach.</p>
        </div>
        <div class="block">
          <h2>Closed beta</h2>
          <p>If you are interested in trying it out early, <a href="beta/">sign up here</a>.</p>
        </div>
      </div>
      <footer>
        <span>Kinami</span>
        <a href="privacy/">Privacy</a>
        <a href="https://kinami.io/">kinami.io</a>
        <span class="sp">omfavn.app</span>
      </footer>
    </section>
  </main>

  <script>
    // The painting plays once, then its img switches to a still of the final frame.
    // It plays from a new blob URL on every page load. Measured in WebKit (2026-09-19): with
    // the plain URL, a same-tab reload reused the finished animation of the cached paint.webp
    // and showed its end frame. The still is decoded before the switch; in Chrome and WebKit
    // that switch showed no empty frame. Reduced motion, or a failed fetch, shows the still.
    (function () {
      var paint = document.querySelector('.ink-paint');
      var STILL = 'assets/ink.webp';
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { paint.src = STILL; return; }
      var url;
      var played = fetch('assets/paint.webp')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(function (blob) {
          return new Promise(function (done, fail) {
            paint.addEventListener('load', done, { once: true });
            paint.addEventListener('error', fail, { once: true });
            paint.src = url = URL.createObjectURL(blob);
          });
        })
        .then(function () { return new Promise(function (done) { setTimeout(done, 2800); }); });
      // The still loads after the window load event. Started earlier, it delayed that event,
      // and WebKit painted nothing on the page until it arrived.
      var stillReady = new Promise(function (done) {
        if (document.readyState === 'complete') done(); else window.addEventListener('load', done, { once: true });
      }).then(function () {
        var still = new Image();
        still.src = STILL;
        return still.decode();
      });
      played.catch(function () {
        if (url) URL.revokeObjectURL(url);
        paint.src = STILL;
      });
      // if the still fails, the painting keeps its last frame
      Promise.all([played, stillReady]).then(function () {
        paint.src = STILL;
        URL.revokeObjectURL(url);
      }, function () {});
    })();

    // The scroll cue moves to the second page without writing #about into the address.
    // With the hash in the URL, every reload of the tab opened on the second page.
    (function () {
      var about = document.getElementById('about');
      document.querySelector('.cue').addEventListener('click', function (e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        about.scrollIntoView();                 // smooth, or instant under reduced motion (CSS)
        about.focus({ preventScroll: true });   // keyboard focus follows, as it would for #about
      });
    })();
  </script>
</body>
</html>
